[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penetration-testing-agents"
version = "1.0.0"
description = "Authorized non-destructive security assessment governance reference system"
requires-python = ">=3.10"
authors = [{name = "Mahsa Keikha"}]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["AGENTS*", "TOOLS*", "SKILLS*", "orchestration*"]
namespaces = true
